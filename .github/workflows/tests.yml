name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Eigen
        # The extension's CMake prefers an installed Eigen 3.4 over fetching
        # the pinned tarball, which keeps the build off the network.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libeigen3-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Check dependency lock
        if: matrix.python-version == '3.14'
        run: uv lock --check

      - name: Run regression suite
        run: uv run --extra test python -m pytest -q tests

  cpp-tests:
    name: C++ tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Eigen
        # The extension's CMake prefers an installed Eigen 3.4 over fetching
        # the pinned tarball, which keeps the build off the network.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libeigen3-dev

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja

      - name: Build C++ tests
        run: cmake --build build

      - name: Run C++ test suite
        run: ctest --test-dir build --output-on-failure

  lean-build:
    name: Lean library
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Lean library
        uses: leanprover/lean-action@v1
        # The kernel checks of the witness modules hold a few GB each; keep
        # at most two of them in flight on the runner (lake has no --jobs
        # flag in this version; it schedules on Lean's thread pool).
        env:
          LEAN_NUM_THREADS: "2"
        with:
          lake-package-directory: lean_proofs
          use-mathlib-cache: true
          test: false
