name: Submissions

on:
  push:
    branches: [main]
    paths:
      - "bounds/**"
      - "schema/**"
      - "verify_challenge/**"
  pull_request:
    paths:
      - "bounds/**"
      - "schema/**"
      - "verify_challenge/**"

permissions:
  # write so that the push-to-main run can commit the receipts it produces;
  # pull-request runs from forks get a read-only token regardless.
  contents: write

jobs:
  bounds:
    name: Verify submitted bounds
    runs-on: ubuntu-latest
    # A certificate may declare up to 3600 s (schema/bound.schema.json,
    # certificate.budget_s); this leaves room for one such certificate plus
    # setup. A pull request adding several long certificates should be split.
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Only what the pull request or the push touched. Re-verifying the
      # whole board on every submission would spend the budget on bounds
      # nobody changed, and on a push to main it did exactly that: the full
      # board takes longer than the job's timeout, so every run on main was
      # cancelled. A pull request diffs against its base; a push diffs
      # against the commit GitHub reports as the previous tip of main, which
      # for a merge is the merged pull request's own changes. A push with no
      # usable previous tip (the first on a branch, or a forced one whose
      # old tip is gone) falls back to the whole board.
      # Collected before the staging step below, which leaves HEAD at the base
      # commit and so would make this diff empty.
      - name: Collect changed submissions
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            from="$BASE"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            from="$BEFORE"
          else
            from=""
          fi
          if [ -n "$from" ]; then
            files=$(git diff --name-only --diff-filter=d "$from" HEAD -- bounds/ | tr '\n' ' ')
          else
            files=$(ls bounds/*.json | tr '\n' ' ')
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "changed: ${files:-none}"

      # A submission must not be able to redefine the checks that judge it, so
      # the schema and the verifier come from the base branch and only the data
      # under bounds/ is taken from the pull request. A lower bound is an
      # exception in kind: its certificate script *is* the submission, so that
      # script is taken from the pull request too. For a branch in this
      # repository everything under verify_challenge/ comes from the PR; for a
      # fork only the certificate scripts the PR adds (new files matching
      # verify_challenge/cert_*.py) do, next to the base branch's verifier,
      # schema and helpers, so a fork can submit a lower bound that CI checks
      # but cannot change how existing bounds are judged. A fork's script that
      # needs new helper modules or research/ data fails here as "not found"
      # or on import and is left for a maintainer to run.
      #
      # Lean sources and their build receipts are the same kind of exception: a
      # bound claiming the lean tier names a module that only exists in the PR.
      # The receipt says the module built, which a PR could assert about itself,
      # so the guarantee behind it is the Tests workflow's "Lean library" job,
      # which compiles the whole library from the PR against mathlib. A module
      # that does not build fails there. An attested bound's stored batch
      # outputs and manifest live under research/, so that is staged too.
      - name: Stage base-branch checks against submitted data
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          head=$(git rev-parse HEAD)
          git checkout --detach "$BASE"
          git checkout "$head" -- bounds/
          if [ "$SAME_REPO" = "true" ]; then
            git checkout "$head" -- verify_challenge/ stabrank/ schema/ pyproject.toml \
                                    lean_proofs/ certs/ research/
            echo "branch in this repository: certificate scripts and Lean sources run from the PR"
          else
            added=$(git diff --name-only --diff-filter=A "$BASE" "$head" -- 'verify_challenge/cert_*.py' | tr '\n' ' ')
            if [ -n "$added" ]; then
              git checkout "$head" -- $added
              echo "fork pull request: certificate scripts added by the PR run from the PR: $added"
            fi
            echo "::notice::fork pull request: the schema, the verifier and its helpers are the base branch's; only certificate scripts this PR adds under verify_challenge/ run from the PR, and anything else they need is left for a maintainer to run"
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Validate against the schema
        run: uv run --extra challenge python verify_challenge/validate_bounds.py

      - name: Verify them
        if: steps.changed.outputs.files != '' && github.event_name == 'pull_request'
        run: |
          uv run --extra challenge python verify_challenge/stabrank_verify.py \
            ${{ steps.changed.outputs.files }}

      # On main the same verification also writes the receipts under certs/
      # (the files site_challenge/build.py would write), and commits them, so
      # a merged bound is verified once, here, and the Site rebuild that
      # follows finds its receipt instead of running the certificate again.
      # The commit touches only certs/, so it triggers neither workflow.
      - name: Verify them and record the receipts
        if: steps.changed.outputs.files != '' && github.event_name == 'push'
        run: |
          uv run --extra challenge python site_challenge/record_receipts.py \
            ${{ steps.changed.outputs.files }}
          git add certs/
          if git diff --cached --quiet; then
            echo "no new receipts"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Record verification receipts for ${{ steps.changed.outputs.files }}"
          # another merge may have landed while the certificates ran
          git pull -q --rebase origin main
          git push origin HEAD:main
